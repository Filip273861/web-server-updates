name: Run update pipeline

on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: [self-hosted, linux]

    defaults:
      run:
        shell: bash

    steps:
      - name: Show current directory
        run: pwd

      - name: Make script executable
        run: chmod +x /home/github-runner/update_pipeline.sh

      - name: Run update script
        run: /home/github-runner/update_pipeline.sh